services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobautoapply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobautoapply}
      POSTGRES_DB: ${POSTGRES_DB:-jobautoapply}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobautoapply}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    # Только localhost — для healthcheck'а на сервере; снаружи закрыт nginx'ом
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Только localhost — снаружи закрыт nginx'ом
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  # ─── Nginx — reverse proxy + SSL termination ──────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    # Запускает nginx и перезагружает конфиг каждые 6 часов (подхватывает обновлённые сертификаты)
    # Используем list-форму чтобы избежать двойного экранирования shell/YAML
    command:
      - /bin/sh
      - -c
      - |
        nginx -g 'daemon off;' &
        NGINX_PID=$$!
        while sleep 6h; do nginx -s reload 2>/dev/null || true; done &
        wait $$NGINX_PID

  # ─── Certbot — автоматический выпуск и обновление сертификатов ───────────
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    # Проверяет обновление каждые 12 часов; Let's Encrypt продлевает за 30 дней до истечения
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew
          sleep 12h &
          wait $$!
        done

volumes:
  postgres_data:
  redis_data:
